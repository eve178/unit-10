<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/shopping-bag-fill.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/home.css"/>
    <link rel="stylesheet" type="text/css" href="css/offers.css"/>
    <title>AMAP Shopping Centre Nottingham </title>
</head>
<body>

<!-- Title -->
<div id="welcometitle">
    <h1> Welcome To AMAP Shopping Centre </h1>
    <p class="question1"> How can we help you today? </p>
    <div class="homeicons">
        <!-- button icons -->
        <button class="movebutton" onclick="history.back()">
            <div class="tooltip">
                <span class="backarrow-tooltiptext"> Go back </span>
                <img src="images/arrowback-white.svg" class="moveicons"> 
            </div>
        </button>
        <button class="movebutton" onclick="location.href='index.html'">
            <div class="tooltip">
                <span class="home-tooltiptext"> Home </span>
                <img src="images/home-white.svg" class="moveicons">
            </div>
        </button>
        <button class="movebutton" onclick="history.forward()">
            <div class="tooltip">
                <span class="forwardarrow-tooltiptext"> Go forward </span>
                <img src="images/arrowforward-white.svg" class="moveicons">
            </div>
        </button>
    </div>
</div>

<!-- Search bar -->
<div id="searchbar">
    <input type="text" placeholder="Search">
    <button type="submit">
        <div class="tooltip">
            <span class="tooltiptext">SEARCH</span>
        <img src="images/search.svg" class="searchicon">
        </div>
    </button>
</div>
